name: Fixture cache validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'spec/fixtures/fixture-app/**'
      - 'script/**'
      - '.github/workflows/fixture-cache.yml'

concurrency:
  group: fixture-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fixture-cache:
    name: Cache identity and GC
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build proxy (release)
        run: make proxy.build

      - name: Generate fixture project
        run: bundle exec ruby script/generate-fixture-app.rb

      - name: Build FixtureKit cache
        working-directory: spec/fixtures/fixture-app
        run: bundle exec ../../../bin/spm-cache build FixtureKit

      - name: Assert cache identity
        working-directory: spec/fixtures/fixture-app
        run: |
          set -euo pipefail
          CACHE_DIR="$HOME/.spm-cache/debug"
          fixture_artifacts=$(ls "$CACHE_DIR" | grep -E '^FixtureKit-[0-9a-f]{8}\.xcframework$')
          test "$(printf '%s\n' "$fixture_artifacts" | wc -l | tr -d ' ')" -eq 1
          test -L "$CACHE_DIR/FixtureKit.xcframework"
          sidecar=$(ls "$CACHE_DIR"/FixtureKit-*.xcframework.provenance.json | head -1)
          grep -q '"cache_key"' "$sidecar"
          grep -q '"last_used_at"' "$sidecar"
          printf 'FixtureKit artifact: %s\n' "$fixture_artifacts"
          printf 'FixtureKit sidecar: %s\n' "$sidecar"

      - name: Assert second-run fast path
        working-directory: spec/fixtures/fixture-app
        run: |
          set -o pipefail
          bundle exec ../../../bin/spm-cache build FixtureKit 2>&1 | tee /tmp/second.log
          grep -q 'No targets to build' /tmp/second.log

      - name: Garbage-collect cache
        working-directory: spec/fixtures/fixture-app
        run: |
          set -euo pipefail
          bundle exec ../../../bin/spm-cache cache gc --dry-run | tee /tmp/gc-dry.log
          bundle exec ../../../bin/spm-cache cache gc | tee /tmp/gc-real.log
          fixture=$(ls "$HOME/.spm-cache/debug" | grep -E '^FixtureKit-[0-9a-f]{8}\.xcframework$')
          test -d "$HOME/.spm-cache/debug/$fixture"
